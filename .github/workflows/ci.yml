name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Only PR runs supersede each other. Give main/manual/release runs their
  # own group so even pending runs are preserved. Include the caller's workflow
  # name to avoid collisions when this suite is reused by the release workflow.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test suite (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for DOM tests
        run: python -m playwright install chromium

      # Run serially: several tests create native wx controls and share the
      # runner's desktop. Manual smoke scripts are not collected by pytest.
      - name: Run test suite
        run: python -m pytest tests -q -p no:cacheprovider --durations=20 --junitxml=test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
