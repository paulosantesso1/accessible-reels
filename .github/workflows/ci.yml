name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Only PR runs supersede each other. Give main/manual/release runs their
  # own group so even pending runs are preserved. Include the caller's workflow
  # name to avoid collisions when this suite is reused by the release workflow.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test suite (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for DOM tests
        run: python -m playwright install chromium

      # Run serially: several tests create native wx controls and share the
      # runner's desktop. Manual smoke scripts are not collected by pytest.
      - name: Run test suite
        run: python -m pytest tests -q -p no:cacheprovider --durations=20 --junitxml=test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
