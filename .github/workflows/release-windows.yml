name: Publicar release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails in seconds, before the Windows test suite, when the tag does not match
  # app_version.py. The build script repeats the check as a second barrier.
  check-version:
    name: Verificar versão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Comparar a tag com APP_VERSION
        shell: bash
        run: |
          set -euo pipefail
          app_version=$(python3 -c "import runpy; print(runpy.run_path('app_version.py')['APP_VERSION'])")
          if ! [[ "$app_version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::APP_VERSION inválida: $app_version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::A tag $GITHUB_REF_NAME difere de v$app_version (APP_VERSION em app_version.py)."
            exit 1
          fi
          echo "Versão $app_version confirmada."

  test:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Gerar instalador
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $version = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+(\.\d+){0,3})$') {
              throw "Tag de versão inválida: $env:GITHUB_REF_NAME"
            }
            $version = $Matches[1]
          }
          .\scripts\build_windows_release.ps1 -PythonExe python -AppVersion $version

      - name: Guardar instalador
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/Accessible-Reels-Setup.exe
            dist/Accessible-Reels-Setup.exe.sha256

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Baixar instalador
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist

      - name: Publicar no GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Accessible-Reels-Setup.exe
            dist/Accessible-Reels-Setup.exe.sha256
