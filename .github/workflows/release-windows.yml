name: Publicar release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails in seconds, before the Windows test suite, when the tag does not match
  # app_version.py. The build script repeats the check as a second barrier.
  check-version:
    name: Verificar versão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Comparar a tag com APP_VERSION
        shell: bash
        run: |
          set -euo pipefail
          app_version=$(python3 -c "import runpy; print(runpy.run_path('app_version.py')['APP_VERSION'])")
          if ! [[ "$app_version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::APP_VERSION inválida: $app_version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::A tag $GITHUB_REF_NAME difere de v$app_version (APP_VERSION em app_version.py)."
            exit 1
          fi
          echo "Versão $app_version confirmada."

  test:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Gerar instalador
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $version = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+(\.\d+){0,3})$') {
              throw "Tag de versão inválida: $env:GITHUB_REF_NAME"
            }
            $version = $Matches[1]
          }
          .\scripts\build_windows_release.ps1 -PythonExe python -AppVersion $version

      - name: Guardar instalador
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/Accessible-Reels-Setup.exe
            dist/Accessible-Reels-Setup.exe.sha256

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Baixar instalador
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: dist

      - name: Publicar no GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Accessible-Reels-Setup.exe
            dist/Accessible-Reels-Setup.exe.sha256
